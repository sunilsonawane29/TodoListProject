
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>My To-Do List</h1>

    <form id="task-form">
        <input id="task-input" type="text" placeholder="New task">
        <button type="submit">Add Task</button>
       
<button id="clear-all-btn" type="button">Clear All Tasks</button>

    </form>
<p id="error-message" style="color: red;"></p>
<p id="task-counter">Total tasks: 0</p>
<p id="completed-counter">Completed: 0</p>
<p id="pending-counter">Pending: 0</p>


    <ul id="task-list"></ul>

    <script src="script.js"></script>
</body>
</html>
